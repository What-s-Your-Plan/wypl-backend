spring:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:db;Mode=Oracle
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2