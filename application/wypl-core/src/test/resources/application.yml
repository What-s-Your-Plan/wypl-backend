# Google
google:
  oauth:
    client-id: google-ouath-client-id
    client-secret: google-ouath-client-secret
    access-token-uri: google-ouath-access-token-url
    redirect-uri: google-ouath-redirect-uri

# Oracle
spring:
  flyway:
    enabled: false
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: create-drop
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:db;Mode=Oracle
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  # Redis
  data:
    redis:
      port: 6379
      host: 127.0.0.1
# Mongo
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 5.0.5


# Weather
open-weather:
  key: open-weather-key
  base-url: https://api.openweathermap.org/data/2.5/weather